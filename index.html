<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Volume Brush</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="Volume Brush">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #ffffff;
  --canvas: #f7f7f5;
  --ink: #161616;
  --ink-2: #4a4a4a;
  --muted: #9a9a9a;
  --line: #ececea;
  --line-2: #e0e0dd;
  --hover: #f4f4f2;
  --accent: #161616;
  --accent-ink: #ffffff;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: 12px;
  color: var(--ink);
  background: var(--bg);
  display: grid;
  grid-template-columns: 56px 1fr 312px;
  grid-template-rows: 52px 1fr;
  grid-template-areas: "top top top" "tools view panel";
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
  grid-area: top;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 13px; letter-spacing: -.01em; margin-right: 14px; }
.brand-mark { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, #cfcfcf 35%, #222 100%); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.spacer { flex: 1; }
.divider { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

.seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.ghost-btn, .primary-btn, .mini-btn {
  border: 1px solid var(--line-2); background: var(--bg); padding: 6px 12px; border-radius: 8px; font-weight: 500;
}
.ghost-btn:hover, .mini-btn:hover { background: var(--hover); }
.primary-btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.primary-btn:hover { background: #333; }
.mini-btn { padding: 3px 8px; border-radius: 6px; font-size: 11px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
.icon-btn svg, .tool svg { width: 18px; height: 18px; }

.chip-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink-2); user-select: none; }
.chip-toggle input { appearance: none; width: 26px; height: 15px; border-radius: 10px; background: var(--line-2); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.chip-toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.chip-toggle input:checked { background: var(--accent); }
.chip-toggle input:checked::after { left: 13px; }
.chip-toggle.small { font-size: 11px; }

/* ---------- left toolbar ---------- */
.toolbar {
  grid-area: tools;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 0;
  background: var(--bg);
  z-index: 4;
}
.tool { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); position: relative; }
.tool:hover { background: var(--hover); color: var(--ink); }
.tool.active { background: var(--accent); color: var(--accent-ink); }
.tool.on::after { content: ""; position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: #2f7cf6; }
.tool-sep { width: 22px; height: 1px; background: var(--line); margin: 6px 0; }
.tool[data-tip]:hover::before {
  content: attr(data-tip); position: absolute; left: 46px; top: 50%; transform: translateY(-50%);
  white-space: nowrap; background: var(--ink); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; pointer-events: none; z-index: 20;
}

/* ---------- viewport ---------- */
.viewport { grid-area: view; position: relative; background: var(--canvas); overflow: hidden; }
#canvasHost, #canvasHost canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#canvasHost canvas { touch-action: none; outline: none; }
.brush-cursor {
  position: absolute; left: 0; top: 0; pointer-events: none;
  border: 1px solid rgba(0,0,0,.55); border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255,255,255,.7);
  transform: translate(-50%, -50%); display: none;
}
.gizmo { position: absolute; left: 12px; bottom: 12px; width: 80px; height: 80px; cursor: pointer; }
.plane-bar {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 7px 12px;
}
.plane-label { color: var(--ink-2); font-weight: 500; }
.plane-val { font-variant-numeric: tabular-nums; color: var(--muted); width: 34px; text-align: right; }
.plane-bar input[type=range] { width: 160px; }
.hint {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  color: var(--muted); font-size: 11px; pointer-events: none; white-space: nowrap;
  background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 20px;
}
.loading { position: absolute; inset: 0; display: flex; gap: 10px; align-items: center; justify-content: center; background: var(--canvas); color: var(--ink-2); z-index: 3; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line-2); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- right panel ---------- */
.panel {
  grid-area: panel;
  border-left: 1px solid var(--line);
  background: var(--bg);
  display: flex; flex-direction: column;
  min-height: 0;
  z-index: 4;
}
.tabs { display: flex; gap: 2px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 10px 10px; color: var(--muted); font-weight: 500; position: relative; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--ink); }
.tabs button.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.tab-body { flex: 1; overflow-y: auto; padding: 4px 0 40px; }
.tab-body::-webkit-scrollbar { width: 8px; }
.tab-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid #fff; }

.selection-banner {
  display: none; margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px;
  background: #eef4ff; color: #1d4fb8; font-weight: 500;
  align-items: center; gap: 6px; flex-wrap: wrap;
}
.selection-banner.show { display: flex; }
.selection-banner .sel-name { flex: 1 0 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
.selection-banner .spacer { flex: 1; }
.selection-banner button { border: 0; background: rgba(255,255,255,.7); color: #1d4fb8; padding: 3px 8px; border-radius: 6px; font-size: 11px; }
.selection-banner button:hover { background: #fff; }

.section { border-bottom: 1px solid var(--line); }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px; cursor: pointer; user-select: none;
  font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2);
}
.section-head::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 2px; }
.section.collapsed .section-head::after { transform: rotate(-45deg); }
.section-body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 11px; }
.section.collapsed .section-body { display: none; }

.row { display: flex; flex-direction: column; gap: 6px; }
.row-head { display: flex; justify-content: space-between; align-items: center; }
.row-label { color: var(--ink-2); }
.row-inline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.num {
  width: 52px; text-align: right; border: 1px solid transparent; border-radius: 5px; padding: 1px 4px;
  background: transparent; color: var(--muted); font-variant-numeric: tabular-nums;
}
.num:hover, .num:focus { border-color: var(--line-2); color: var(--ink); outline: none; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, var(--ink) 0, var(--ink) var(--p, 0%), var(--line-2) var(--p, 0%)); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); margin-top: -5px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
input[type=range]::-moz-range-track { height: 2px; background: var(--line-2); border-radius: 2px; }
input[type=range]::-moz-range-progress { height: 2px; background: var(--ink); }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }

.color-input { display: flex; align-items: center; gap: 8px; }
.color-input input[type=color] { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
.color-input input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
.color-input input[type=color]::-webkit-color-swatch { border: 0; border-radius: 4px; }
.color-input .hex { color: var(--muted); font-variant-numeric: tabular-nums; text-transform: uppercase; }

select, .text-input, textarea {
  width: 100%; border: 1px solid var(--line-2); background: var(--bg); border-radius: 7px; padding: 6px 8px; outline: none;
}
select:focus, .text-input:focus, textarea:focus { border-color: var(--ink); }
textarea { resize: vertical; min-height: 56px; line-height: 1.4; }

.segmented { display: flex; background: var(--hover); border-radius: 7px; padding: 2px; gap: 2px; }
.segmented button { flex: 1; border: 0; background: transparent; padding: 5px 4px; border-radius: 5px; color: var(--ink-2); font-size: 11px; }
.segmented button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }

.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-row > button { flex: 1; }

/* brush presets */
.preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.preset {
  border: 1px solid transparent; border-radius: 10px; background: transparent; padding: 4px 2px 5px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-2); font-size: 10px;
}
.preset:hover { background: var(--hover); }
.preset.active { border-color: var(--ink); color: var(--ink); }
.preset .thumb { width: 52px; height: 52px; border-radius: 8px; background: var(--hover) center/cover no-repeat; }
.preset .name { max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* texture slots */
.slot { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; }
.slot .slot-thumb { width: 40px; height: 40px; border-radius: 7px; border: 1px solid var(--line); background: repeating-conic-gradient(#f0f0ee 0 25%, #fff 0 50%) 0 0/10px 10px; background-size: cover; background-position: center; }
.slot .slot-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slot .slot-name { font-weight: 500; }
.slot select { padding: 3px 6px; font-size: 11px; }
.slot .mini-btn { white-space: nowrap; }
.library { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.library .lib-item { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: center/cover; position: relative; }
.library .lib-item button { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 10px; line-height: 16px; padding: 0; display: none; }
.library .lib-item:hover button { display: block; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 11px; line-height: 1.45; }

.font-preview { font-size: 22px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; text-align: center; min-height: 48px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- export panel ---------- */
.export-panel {
  position: fixed; right: 324px; top: 62px; width: 300px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  z-index: 10; max-height: calc(100vh - 80px); overflow-y: auto;
}
.export-panel .ex-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; font-weight: 600; font-size: 13px; }
.export-panel .ex-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.export-panel h4 { margin: 8px 0 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.format-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.format-grid button { border: 1px solid var(--line-2); background: #fff; border-radius: 7px; padding: 7px 0; font-weight: 500; }
.format-grid button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.export-panel .primary-btn { width: 100%; padding: 9px; }

.size-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.size-row .text-input { width: 70px; padding: 5px 6px; }
.export-panel { overflow-x: hidden; }
.sub-options { display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 9px; background: var(--hover); }
.export-frame {
  position: absolute; pointer-events: none; z-index: 1;
  outline: 1px dashed rgba(0,0,0,.45);
  box-shadow: 0 0 0 100vmax rgba(20,20,20,.16);
}
.drop-hint {
  position: absolute; inset: 14px; display: none; place-items: center; z-index: 6; pointer-events: none;
  border: 2px dashed var(--ink); border-radius: 16px; background: rgba(255,255,255,.82);
  font-weight: 600; font-size: 14px;
}
.viewport.dropping .drop-hint { display: grid; }

/* ---------- canvas mode (panel hidden, pop-ups) ---------- */
.bar-btn {
  border: 1px solid var(--line-2); background: var(--bg); border-radius: 7px; padding: 6px 10px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
}
.bar-btn:hover { background: var(--hover); color: var(--ink); }
.bar-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

.quick, .dock { display: none; }
body.canvas-mode { grid-template-columns: 1fr; grid-template-rows: 52px 1fr; grid-template-areas: "top" "view"; }
body.canvas-mode .panel { display: none; }
body.canvas-mode .plane-bar { display: none; }
body.canvas-mode .toolbar {
  position: fixed; left: 12px; top: 64px; z-index: 8;
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 6px; max-height: calc(100vh - 80px); overflow-y: auto;
}
body.canvas-mode .gizmo { left: auto; right: 12px; bottom: 76px; }
body.canvas-mode .quick { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.swatch { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--hover) center/cover; padding: 0; }
.vslider { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.vs-track { position: relative; width: 26px; height: 110px; border-radius: 13px; background: var(--hover); touch-action: none; cursor: ns-resize; overflow: visible; }
.vs-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 13px; background: #dcdcd8; }
.vs-knob { position: absolute; left: 3px; width: 20px; height: 14px; border-radius: 7px; background: var(--ink); }
.vs-label { font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

body.canvas-mode .dock {
  display: flex; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 8;
  gap: 4px; padding: 5px; background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); max-width: calc(100% - 24px); overflow-x: auto;
}
.dock button {
  border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 9px 12px; white-space: nowrap;
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
}
.dock button:hover { background: var(--hover); color: var(--ink); }
.dock button.active { background: var(--ink); color: #fff; }

.popover {
  position: fixed; z-index: 12; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 18px 48px rgba(0,0,0,.14); overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.pop-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 10px 10px 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.popover .section-head { padding-top: 12px; padding-bottom: 8px; pointer-events: none; }
.popover .section-head::after { display: none; }
.popover .section:last-child { border-bottom: 0; }
.gesture-list { display: grid; gap: 6px; }
.gesture-list div { display: flex; justify-content: space-between; gap: 10px; }
.gesture-list b { font-weight: 600; white-space: nowrap; }
.gesture-list span { color: var(--muted); text-align: right; }

body.canvas-mode .viewport > .selection-banner {
  position: absolute; top: 44px; left: 50%; transform: translateX(-50%); z-index: 7; margin: 0;
  width: min(520px, calc(100% - 140px)); box-shadow: var(--shadow);
}
body.canvas-mode .export-panel { right: 12px; }

/* ---------- relief (2.5D sheet) mode ---------- */
body:not(.relief-mode) .relief-only { display: none !important; }
body.relief-mode .td-only { display: none !important; }
body.relief-mode #canvasHost, body.relief-mode .gizmo, body.relief-mode .plane-bar, body.relief-mode .export-frame { display: none !important; }
.sheet-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
body.relief-mode .sheet-canvas { display: block; }
.sheet-guides { position: absolute; inset: 0; pointer-events: none; display: none; }
body.relief-mode .sheet-guides { display: block; }
.sheet-guides line { stroke: rgba(200, 70, 50, .55); stroke-width: 1; stroke-dasharray: 5 5; }
.sheet-guides .centre { fill: none; stroke: rgba(200, 70, 50, .7); }
.sheet-guides .sheet-edge { fill: none; stroke: rgba(0, 0, 0, .08); }
.sheet-status {
  display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; z-index: 6;
  align-items: center; justify-content: space-between; padding: 0 12px;
  background: rgba(255, 255, 255, .92); border-top: 1px solid var(--line);
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
body.relief-mode .sheet-status { display: flex; }
.sheet-status .st-left, .sheet-status .st-right { display: flex; align-items: center; gap: 12px; white-space: nowrap; overflow: hidden; }
.sheet-status button { border: 0; background: transparent; font: inherit; color: var(--ink); padding: 2px 4px; border-radius: 4px; }
.sheet-status button:hover { background: var(--hover); }
body.relief-mode.canvas-mode .dock { bottom: 38px; }
.mode-switch button { min-width: 64px; font-weight: 600; letter-spacing: .02em; }

.mat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mat-ball { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: var(--ink-2); font-size: 10px; }
.mat-ball .ball { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 2px solid transparent; background: var(--hover) center/cover; }
.mat-ball.active .ball { border-color: var(--ink); }
.mat-ball.active { color: var(--ink); font-weight: 600; }
.mat-name { text-transform: uppercase; letter-spacing: .05em; font-size: 9px; }
.tint-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tint { position: relative; aspect-ratio: 1.5; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); padding: 0; }
.tint.active { outline: 2px solid var(--ink); outline-offset: 1px; }
.tint.add { background: var(--bg); border: 1px dashed var(--line-2); color: var(--muted); font-size: 16px; }
.tint-x { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 10px; line-height: 16px; display: none; }
.tint:hover .tint-x { display: block; }
.hidden-color { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
.sub-group { display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 9px; background: var(--hover); }
.sub-group.dim { opacity: .45; }
.only-tag { font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: 4px; }
.drop-zone.small { padding: 12px; }

/* ---------- iPad "Add to Home Screen" (full screen): stay clear of the home bar ---------- */
@supports (padding: env(safe-area-inset-bottom)) {
  .sheet-status { height: calc(26px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); }
  body.canvas-mode .dock { bottom: calc(14px + env(safe-area-inset-bottom)); }
  body.relief-mode.canvas-mode .dock { bottom: calc(38px + env(safe-area-inset-bottom)); }
  .topbar { padding-left: calc(14px + env(safe-area-inset-left)); padding-right: calc(14px + env(safe-area-inset-right)); }
}

/* ---------- drag & drop targets ---------- */
.drop-zone {
  display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%;
  padding: 18px 12px; border: 1.5px dashed var(--line-2); border-radius: 12px; background: var(--hover);
  color: var(--ink-2); text-align: center; transition: border-color .12s, background .12s;
}
.drop-zone:hover { border-color: var(--muted); }
.dz-icon svg { width: 22px; height: 22px; }
.dz-title { font-weight: 600; color: var(--ink); }
.dz-sub { font-size: 11px; color: var(--muted); }
.library.drop-target { min-height: 56px; padding: 6px; margin: -6px; border-radius: 10px; border: 1.5px dashed transparent; }
.slot.drop-target { border-radius: 9px; outline: 1.5px dashed transparent; outline-offset: 3px; }
.drop-target.drag-over, .drop-zone.drag-over { border-color: #2f7cf6; outline-color: #2f7cf6; background: #eef4ff; }

/* ---------- brush balls ---------- */
.preset-grid { grid-template-columns: repeat(6, 1fr); gap: 6px; }
.preset { padding: 3px; border-radius: 50%; border: 2px solid transparent; aspect-ratio: 1; justify-content: center; }
.preset:hover { background: transparent; border-color: var(--line-2); }
.preset.active { border-color: var(--ink); }
.preset .thumb { width: 100%; height: auto; aspect-ratio: 1; border-radius: 50%; background-color: transparent; background-size: 118%; background-position: center; }
.preset .name { display: none; }

/* ---------- brush window (live preview + sliders) ---------- */
.brush-window {
  position: fixed; right: 12px; top: 62px; z-index: 11; width: min(380px, calc(100vw - 24px));
  max-height: calc(100vh - 150px); display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 18px 48px rgba(0,0,0,.14);
}
.brush-window.docked { right: 324px; }
.bw-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 10px; border-bottom: 1px solid var(--line); cursor: grab; touch-action: none; }
.bw-ball { width: 26px; height: 26px; border-radius: 50%; background: var(--hover) center/118%; flex: none; }
.bw-name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bw-preview { position: relative; flex: none; }
.bw-canvas { display: block; width: 100%; height: 170px; background: #efefec; cursor: grab; }
.bw-hint { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: var(--muted); pointer-events: none; }
.bw-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.bw-body .section:last-child { border-bottom: 0; }

/* ---------- touch screens (iPad) ---------- */
@media (pointer: coarse) {
  .tool { width: 46px; height: 46px; }
  .tool[data-tip]:hover::before { display: none; }
  .icon-btn { width: 40px; height: 40px; }
  .ghost-btn, .primary-btn, .bar-btn { padding: 10px 14px; }
  .mini-btn { padding: 8px 12px; font-size: 12px; }
  input[type=range] { height: 30px; }
  input[type=range]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -11px; }
  .segmented button { padding: 10px 6px; font-size: 12px; }
  .seg button { padding: 9px 12px; }
  .section-body { gap: 14px; }
  .num { width: 64px; font-size: 13px; }
  .chip-toggle input { width: 40px; height: 24px; border-radius: 12px; }
  .chip-toggle input::after { width: 20px; height: 20px; }
  .chip-toggle input:checked::after { left: 18px; }
  .dock button { padding: 13px 14px; font-size: 12px; }
  .vs-track { height: 140px; width: 32px; }
  .vs-knob { width: 26px; height: 18px; }
  .bw-canvas { height: 200px; }
  select, .text-input, textarea { font-size: 16px; padding: 9px 10px; } /* 16px stops iOS zooming into inputs */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  textarea, input { -webkit-user-select: text; user-select: text; }
}
@media (max-width: 900px) {
  body.canvas-mode .topbar .brand { margin-right: 0; font-size: 12px; }
  .bar-btn { padding: 8px 8px; }
}

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 9px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 50; font-weight: 500;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  body { grid-template-columns: 48px 1fr; grid-template-rows: 52px 1fr 45vh; grid-template-areas: "top top" "tools view" "panel panel"; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .export-panel { right: 12px; left: 12px; width: auto; }
  #viewButtons, .chip-toggle:not(.small) { display: none; }
  .plane-bar input[type=range] { width: 90px; }
}

// ---------------------------------------------------------------- GLSL
const NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s / 0.9375; }
float worley(vec2 p){ vec2 i = floor(p), f = fract(p); float d = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) { vec2 g = vec2(float(x), float(y)); d = min(d, length(g + hash22(i + g) - f)); }
  return d; }
`;

const QUAD_VERT = /* glsl */`
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const COPY_FRAG = /* glsl */`
uniform sampler2D tSrc;
varying vec2 vUv;
void main() { gl_FragColor = texture2D(tSrc, vUv); }`;

// One instanced quad per dab. Writes into the stroke buffer with MAX blending:
// R = height inside the dab, G = anti-aliased coverage, B = proximity skirt outside (for fusing).
const DAB_VERT = /* glsl */`
uniform vec2 origin; uniform vec2 viewSize; uniform float pad;
attribute vec4 dabA; // x, y, r, s (arc length)
attribute vec4 dabB; // dir.x, dir.y, -, -
varying vec2 vP; varying vec4 vA; varying vec4 vB;
void main() {
  float R = dabA.z * 1.5 + pad;
  vec2 p = dabA.xy + position.xy * R;
  vP = p; vA = dabA; vB = dabB;
  vec2 c = (p - origin) / viewSize;
  gl_Position = vec4(c.x * 2.0 - 1.0, 1.0 - c.y * 2.0, 0.0, 1.0);
}`;

const DAB_FRAG = /* glsl */`
uniform float convexity, heightRatio, edgeRough, noiseAmp, noiseFreq, dents, dentFreq, welt, seamAmp, seamPitch, seamChaos, skirt, aa, sizeRef;
uniform int profile;
varying vec2 vP; varying vec4 vA; varying vec4 vB;
${NOISE}
void main() {
  vec2 c = vA.xy; float r = vA.z; float s = vA.w; vec2 dir = vB.xy;
  float e = edgeRough > 0.0 ? (fbm(vP / (sizeRef * 0.35)) - 0.5) * 2.0 * edgeRough * 0.45 : 0.0;
  float rr = max(r * (1.0 + e), 0.3);
  float d = length(vP - c);
  float prox = 1.0 - clamp((d - rr) / max(skirt, 1e-3), 0.0, 1.0);
  if (d >= rr + skirt) discard;
  float h = 0.0, mask = 0.0;
  if (d < rr) {
    float t = d / rr;
    if (profile == 1) {
      // chisel: sharp spine along the stroke + rounded ends
      float across = abs(dot(vP - c, vec2(-dir.y, dir.x))) / rr;
      h = pow(max(1.0 - across, 0.0), mix(1.5, 0.65, convexity)) * pow(max(1.0 - t * t, 0.0), 0.35);
      h += welt * 0.35 * exp(-across * across * 60.0);
    } else {
      h = pow(max(1.0 - t * t, 0.0), mix(0.12, 0.9, convexity));
    }
    h *= r * heightRatio;
    if (seamAmp > 0.0) {
      float along = s + dot(vP - c, dir);
      float ph = along / max(seamPitch * sizeRef * 0.35, 0.5) + seamChaos * fbm(vP / (sizeRef * 0.9)) * 6.0;
      float ridge = cos(ph * 6.2831853) * 0.5 + 0.5;
      ridge = mix(ridge, ridge * fbm(vP / (sizeRef * 0.5)) * 1.6, seamChaos * 0.6);
      h *= 1.0 + seamAmp * 0.12 * ridge;
    }
    float n = fbm(vP * noiseFreq) - 0.5;
    h += noiseAmp * sizeRef * 0.22 * n * smoothstep(0.0, 0.35, 1.0 - t);
    if (dents > 0.0) { float w = worley(vP * dentFreq); h -= dents * sizeRef * 0.22 * smoothstep(0.4, 0.05, w) * smoothstep(0.0, 0.4, 1.0 - t); }
    h = max(h, 0.0);
    mask = 1.0 - smoothstep(rr - aa, rr, d);
  }
  gl_FragColor = vec4(h, mask, prox, 1.0);
}`;

// Combine the sheet as it was before this stroke (base) with the stroke buffer.
const COMPOSE_H_FRAG = /* glsl */`
uniform sampler2D tBase, tStroke;
uniform int mode; uniform float k, skirt, plateLevel, brushId;
varying vec2 vUv;
float smax(float a, float b, float k) { if (k <= 0.0) return max(a, b); float h = max(k - abs(a - b), 0.0) / k; return max(a, b) + h * h * k * 0.25; }
void main() {
  vec4 base = texture2D(tBase, vUv); vec4 st = texture2D(tStroke, vUv);
  float h0 = base.r, id0 = base.g;
  float sh = st.r, m = st.g;
  // virtual stroke height: real height inside, sloping below zero just outside (lets strokes fuse)
  float sv = sh > 0.0 ? sh : -(1.0 - st.b) * skirt;
  float h = h0;
  float take = 0.0;
  if (mode == 0) {          // raise: fuse into one mass
    float fused = smax(h0, sv, k);
    float w = smoothstep(0.0, max(k * 0.5, 0.5), h0);   // only fuse onto existing material, crisp on bare paper
    h = mix(max(h0, sh), max(fused, max(h0, sh)), w);
    take = smoothstep(-0.6, 0.6, sh - h0) * m;
  } else if (mode == 1) {   // stack: sits on top of what's there
    h = h0 + sh;
    take = m;
  } else if (mode == 2) {   // plate: level everything under the brush to one height
    h = mix(h0, plateLevel + sh * 0.15, m);
    take = m;
  } else if (mode == 3) {   // press: push into the material
    h = max(h0 - sh * 0.9, 0.0);
  } else {                  // erase
    h = h0 * (1.0 - m);
  }
  float id = take > 0.5 ? brushId : id0;
  gl_FragColor = vec4(h, id, 0.0, 1.0);
}`;

const COMPOSE_C_FRAG = /* glsl */`
uniform sampler2D tBase, tStroke, tColor0;
uniform int mode; uniform vec3 brushColor;
varying vec2 vUv;
void main() {
  vec4 base = texture2D(tBase, vUv); vec4 st = texture2D(tStroke, vUv); vec4 c0 = texture2D(tColor0, vUv);
  float take = 0.0;
  if (mode == 0) take = smoothstep(-0.6, 0.6, st.r - base.r) * st.g;
  else if (mode == 1 || mode == 2) take = st.g;
  gl_FragColor = vec4(mix(c0.rgb, brushColor, take), 1.0);
}`;

const SHADE_FRAG = /* glsl */`
uniform sampler2D tH, tC, tUnder;
uniform vec2 texSize;          // texels
uniform vec2 surfOrigin, surfSize; // surface area in sheet units
uniform vec2 sheetSize;
uniform int direct;            // 1 = render the surface 1:1 into a target (export)
uniform vec2 viewOffset; uniform float zoom; uniform vec2 screenSize; uniform float dpr;
uniform vec3 L; uniform float shadowStr, shadowLen;
uniform vec3 paper, outside;
uniform int transparent;
uniform float underOpacity; uniform int showUnder;
uniform float fleckFreq, fleckAmount;
uniform float mRough[5], mMetal[5], mSpec[5], mWrap[5], mFleck[5];
varying vec2 vUv;
${NOISE}
float H(vec2 uv) { return texture2D(tH, uv).r; }
vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }
vec3 env(vec3 r, vec3 l) {
  vec3 key = normalize(vec3(l.xy * 0.9, 0.55));
  float soft = smoothstep(0.25, 0.97, dot(r, key));
  float top = smoothstep(-0.15, 0.75, r.y);
  float rim = pow(1.0 - max(r.z, 0.0), 3.0);
  float band = smoothstep(0.05, 0.0, abs(r.x * 0.7 + r.y * 0.3 + 0.15)) * 0.25;
  return vec3(0.06 + 0.95 * soft + 0.22 * top + 0.18 * rim + band);
}
void main() {
  vec2 sheetP;
  vec2 uv;
  if (direct == 1) {
    uv = vUv;
    sheetP = surfOrigin + vec2(vUv.x, 1.0 - vUv.y) * surfSize;
  } else {
    vec2 css = vec2(gl_FragCoord.x, screenSize.y * dpr - gl_FragCoord.y) / dpr;
    sheetP = (css - viewOffset) / zoom;
    if (sheetP.x < 0.0 || sheetP.y < 0.0 || sheetP.x > sheetSize.x || sheetP.y > sheetSize.y) {
      gl_FragColor = vec4(outside, transparent == 1 ? 0.0 : 1.0); return;
    }
    vec2 q = (sheetP - surfOrigin) / surfSize;
    uv = vec2(q.x, 1.0 - q.y);
  }
  vec2 tx = 1.0 / texSize;
  float upt = surfSize.x / texSize.x;   // sheet units per texel
  float h = H(uv);
  float hl = H(uv - vec2(tx.x, 0.0)), hr = H(uv + vec2(tx.x, 0.0));
  float hd = H(uv - vec2(0.0, tx.y)), hu = H(uv + vec2(0.0, tx.y));
  float hl2 = H(uv - vec2(2.0 * tx.x, 0.0)), hr2 = H(uv + vec2(2.0 * tx.x, 0.0));
  float hd2 = H(uv - vec2(0.0, 2.0 * tx.y)), hu2 = H(uv + vec2(0.0, 2.0 * tx.y));
  float dx = ((hr - hl) * 0.6 + (hr2 - hl2) * 0.2) / (2.0 * upt);
  float dy = ((hu - hd) * 0.6 + (hu2 - hd2) * 0.2) / (2.0 * upt);
  vec3 n = normalize(vec3(-dx, -dy, 1.0));
  float cover = smoothstep(0.05, 0.7, h);

  // cast shadow / self shadow: march toward the light across the height field
  vec2 ldir = normalize(L.xy + 1e-5);
  float tanE = L.z / max(length(L.xy), 1e-3);
  float lit = 1.0;
  for (int i = 1; i <= 22; i++) {
    float t = shadowLen * pow(float(i) / 22.0, 1.35);
    vec2 q = uv + ldir * t / surfSize * vec2(1.0, 1.0);
    float hq = H(q);
    float ray = h + t * tanE;
    float diff = hq - ray;
    if (diff > 0.0) lit = min(lit, 1.0 - clamp(diff / (t * 0.12 + 0.8), 0.0, 1.0));
  }

  // cavity: lower than the neighbourhood → darker
  vec2 co = vec2(4.0 / upt) * tx;   // ~4 sheet units, independent of the export resolution
  float around = (H(uv + vec2(co.x, 0.0)) + H(uv - vec2(co.x, 0.0)) + H(uv + vec2(0.0, co.y)) + H(uv - vec2(0.0, co.y))) * 0.25;
  float cav = 1.0 - clamp((around - h) * 0.045, 0.0, 0.45);

  // paper (with optional sketch underlay)
  vec3 pap = toLin(paper) * (0.985 + 0.03 * vnoise(sheetP * 0.9));
  if (showUnder == 1) { vec4 u = texture2D(tUnder, vec2(sheetP.x / sheetSize.x, 1.0 - sheetP.y / sheetSize.y)); pap = mix(pap, toLin(u.rgb), u.a * underOpacity); }
  float paperShade = mix(1.0, lit, shadowStr * 0.75);
  vec3 paperCol = pap * paperShade;

  vec3 col = paperCol;
  if (cover > 0.001) {
    ivec2 tc = clamp(ivec2(uv * texSize), ivec2(0), ivec2(texSize) - 1);
    int id = int(texelFetch(tH, tc, 0).g + 0.5);
    id = clamp(id, 0, 4);
    float rough = mRough[id], metal = mMetal[id], spec = mSpec[id], wrap = mWrap[id];
    vec3 alb = toLin(texture2D(tC, uv).rgb);
    if (mFleck[id] > 0.5 && fleckAmount > 0.0) {
      vec2 g = sheetP * fleckFreq;
      vec2 cell = floor(g);
      float rnd = hash12(cell);
      vec2 o = hash22(cell + 3.1);
      float dd = length(fract(g) - (0.25 + 0.5 * o));
      float chip = step(rnd, fleckAmount * 0.35) * smoothstep(0.22, 0.16, dd + 0.08 * vnoise(g * 5.0));
      vec3 palette[6] = vec3[6](vec3(0.85,0.18,0.15), vec3(0.15,0.35,0.85), vec3(0.95,0.75,0.1), vec3(0.1,0.6,0.35), vec3(0.08,0.08,0.09), vec3(0.95,0.95,0.92));
      vec3 chipCol = toLin(palette[int(hash12(cell + 7.7) * 5.99)]);
      alb = mix(alb, chipCol, chip);
    }
    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 Hh = normalize(L + V);
    float ndl = dot(n, L);
    float diff = max((ndl + wrap) / (1.0 + wrap), 0.0);
    float shad = mix(1.0, lit, 0.92);
    float amb = 0.30 + 0.22 * n.z;
    float shin = mix(220.0, 10.0, rough);
    float sp = pow(max(dot(n, Hh), 0.0), shin) * (1.0 - rough * 0.55) * spec;
    vec3 r = reflect(-V, n);
    vec3 e = env(r, L);
    float fres = 0.04 + 0.96 * pow(1.0 - max(n.z, 0.0), 5.0);
    vec3 diel = alb * (diff * shad * 1.05 + amb * cav) + vec3(sp * shad * 0.55) + e * fres * (1.0 - rough) * 0.35;
    vec3 f0 = max(alb, vec3(0.2));   // even dark metal keeps bright reflections
    vec3 met = f0 * e * mix(1.0, 0.55, rough) * cav * 0.95 + alb * amb * 0.25 + f0 * sp * shad * 1.6;
    col = mix(diel, met, metal);
    col = mix(paperCol, col, cover);
  }
  vec3 outc = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  if (transparent == 1) {
    float shadowA = (1.0 - paperShade);
    float a = max(cover, shadowA * 0.9);
    vec3 c = cover > 0.001 ? outc : vec3(0.0);
    gl_FragColor = vec4(a > 0.0 ? c : vec3(0.0), a);
  } else {
    gl_FragColor = vec4(outc, 1.0);
  }
}`;

// ---------------------------------------------------------------- engine
const MAX_DABS = 4096;
const MODE_INDEX = { raise: 0, stack: 1, plate: 2, press: 3, erase: 4 };

function target(w, h, type, mip = false) {
  const t = new THREE.WebGLRenderTarget(w, h, {
    type, format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false,
    minFilter: mip ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter, magFilter: THREE.LinearFilter,
    generateMipmaps: mip, wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  });
  return t;
}

const shaderMat = (frag, uniforms, extra = {}) => new THREE.ShaderMaterial({
  vertexShader: QUAD_VERT, fragmentShader: frag, uniforms,
  depthTest: false, depthWrite: false, ...extra,
});

class ReliefEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
    this.renderer.autoClear = false;
    this.renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // shaders output sRGB themselves
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    this.quad.frustumCulled = false;
    this.quadScene = new THREE.Scene();
    this.quadScene.add(this.quad);

    this.copyMat = shaderMat(COPY_FRAG, { tSrc: { value: null } });
    this.composeHMat = shaderMat(COMPOSE_H_FRAG, {
      tBase: { value: null }, tStroke: { value: null }, mode: { value: 0 }, k: { value: 0 }, skirt: { value: 1 },
      plateLevel: { value: 10 }, brushId: { value: 0 },
    });
    this.composeCMat = shaderMat(COMPOSE_C_FRAG, {
      tBase: { value: null }, tStroke: { value: null }, tColor0: { value: null }, mode: { value: 0 }, brushColor: { value: new THREE.Color() },
    });
    const arr = key => MATERIALS.map(m => m.shade[key]);
    this.shadeMat = shaderMat(SHADE_FRAG, {
      tH: { value: null }, tC: { value: null }, tUnder: { value: null },
      texSize: { value: new THREE.Vector2() }, surfOrigin: { value: new THREE.Vector2() }, surfSize: { value: new THREE.Vector2() },
      sheetSize: { value: new THREE.Vector2() }, direct: { value: 0 },
      viewOffset: { value: new THREE.Vector2() }, zoom: { value: 1 }, screenSize: { value: new THREE.Vector2() }, dpr: { value: 1 },
      L: { value: new THREE.Vector3(0, 0, 1) }, shadowStr: { value: 0.6 }, shadowLen: { value: 120 },
      paper: { value: new THREE.Vector3(0.95, 0.95, 0.94) }, outside: { value: new THREE.Vector3(0.9, 0.9, 0.89) },
      transparent: { value: 0 }, underOpacity: { value: 0.45 }, showUnder: { value: 0 },
      fleckFreq: { value: 0.12 }, fleckAmount: { value: 1 },
      mRough: { value: arr('rough') }, mMetal: { value: arr('metal') }, mSpec: { value: arr('spec') }, mWrap: { value: arr('wrap') }, mFleck: { value: arr('flecks') },
    });
    this.blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1);
    this.blank.needsUpdate = true;

    // instanced dabs
    const base = new THREE.PlaneGeometry(2, 2);
    const g = new THREE.InstancedBufferGeometry();
    g.index = base.index;
    g.setAttribute('position', base.attributes.position);
    g.setAttribute('uv', base.attributes.uv);
    this.dabA = new THREE.InstancedBufferAttribute(new Float32Array(MAX_DABS * 4), 4);
    this.dabB = new THREE.InstancedBufferAttribute(new Float32Array(MAX_DABS * 4), 4);
    this.dabA.setUsage(THREE.DynamicDrawUsage);
    this.dabB.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('dabA', this.dabA);
    g.setAttribute('dabB', this.dabB);
    g.instanceCount = 0;
    this.dabMat = new THREE.ShaderMaterial({
      vertexShader: DAB_VERT, fragmentShader: DAB_FRAG,
      uniforms: {
        origin: { value: new THREE.Vector2() }, viewSize: { value: new THREE.Vector2() }, pad: { value: 1 },
        convexity: { value: 0.3 }, heightRatio: { value: 0.55 }, edgeRough: { value: 0 }, noiseAmp: { value: 0 }, noiseFreq: { value: 0.1 },
        dents: { value: 0 }, dentFreq: { value: 0.2 }, welt: { value: 0 }, seamAmp: { value: 0 }, seamPitch: { value: 1 }, seamChaos: { value: 0 },
        skirt: { value: 4 }, aa: { value: 1 }, sizeRef: { value: 30 }, profile: { value: 0 },
      },
      depthTest: false, depthWrite: false, transparent: true,
      side: THREE.DoubleSide, // the y-flip in the vertex shader reverses the winding
      blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendEquationAlpha: THREE.MaxEquation,
      blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor,
    });
    this.dabMesh = new THREE.Mesh(g, this.dabMat);
    this.dabMesh.frustumCulled = false;
    this.dabScene = new THREE.Scene();
    this.dabScene.add(this.dabMesh);
  }

  /** A drawable area: origin/size in sheet units, rendered at `scale` texels per unit. */
  createSurface({ originX = 0, originY = 0, width, height, scale = 1 }) {
    const w = Math.max(1, Math.round(width * scale)), h = Math.max(1, Math.round(height * scale));
    const HF = THREE.HalfFloatType, U8 = THREE.UnsignedByteType;
    const sf = {
      origin: new THREE.Vector2(originX, originY), size: new THREE.Vector2(width, height), scale, w, h,
      H: target(w, h, HF), H0: target(w, h, HF), S: target(w, h, HF), C: target(w, h, U8), C0: target(w, h, U8),
    };
    this.clearSurface(sf);
    return sf;
  }

  disposeSurface(sf) { for (const k of ['H', 'H0', 'S', 'C', 'C0']) sf[k]?.dispose(); }

  pass(mat, tgt) {
    this.quad.material = mat;
    this.renderer.setRenderTarget(tgt);
    this.renderer.render(this.quadScene, this.camera);
  }

  clearTarget(t, r = 0, g = 0, b = 0, a = 0) {
    this.renderer.setRenderTarget(t);
    this.renderer.setClearColor(new THREE.Color(r, g, b), a);
    this.renderer.clear(true, false, false);
  }

  clearSurface(sf) {
    for (const k of ['H', 'H0', 'S']) this.clearTarget(sf[k]);
    this.clearTarget(sf.C, 1, 1, 1, 1);
    this.clearTarget(sf.C0, 1, 1, 1, 1);
  }

  copy(src, dst) { this.copyMat.uniforms.tSrc.value = src.texture; this.pass(this.copyMat, dst); }

  beginStroke(sf) {
    this.copy(sf.H, sf.H0);
    this.copy(sf.C, sf.C0);
    this.clearTarget(sf.S);

// Shift: the stroke becomes a straight line from where it started
function straightLine(x, y, pr) {
  const st = R.stroke;
  const p0 = st.stroke.pts.slice(0, 3);
  st.stroke.pts = [...p0, +x.toFixed(2), +y.toFixed(2), +pr.toFixed(3)];
  st.dabber = makeDabber(st.stroke);
  R.engine.clearTarget(R.sf.S);
  const d = [...st.dabber.add(p0[0], p0[1], p0[2]), ...st.dabber.add(x, y, pr)];
  R.pending = [];
  const bb = R.engine.drawDabs(R.sf, new Float32Array(d), st.stroke.brush);
  const prev = st.lineBB || bb;
  const u = [Math.min(prev[0], bb[0]), Math.min(prev[1], bb[1]), Math.max(prev[2], bb[2]), Math.max(prev[3], bb[3])];
  R.engine.compose(R.sf, st.stroke.brush, st.stroke.mode, u);
  st.lineBB = bb;
  st.last = [x, y];
  R.dirty = true;
}

let flushQueued = false;
function scheduleFlush() {
  if (flushQueued) return;
  flushQueued = true;
  requestAnimationFrame(() => { flushQueued = false; flush(); });
}
function flush() {
  const st = R.stroke;
  if (!st || !R.pending.length) return;
  const bb = R.engine.drawDabs(R.sf, new Float32Array(R.pending), st.stroke.brush);
  R.pending = [];
  R.engine.compose(R.sf, st.stroke.brush, st.stroke.mode, bb);
  R.dirty = true;
}

function endStroke() {
  const st = R.stroke;
  if (!st) return;
  for (const v of st.dabber.finish()) R.pending.push(v);
  flush();
  R.stroke = null;
  if (!st.stroke.pts.length) return;
  const stroke = st.stroke;
  app.sheet.strokes.push(stroke);
  pushHistory({
    label: 'Relief stroke',
    undo: () => { const i = app.sheet.strokes.lastIndexOf(stroke); if (i >= 0) app.sheet.strokes.splice(i, 1); replayAll(); },
    redo: () => { app.sheet.strokes.push(stroke); stampStroke(R.engine, R.sf, stroke); R.dirty = true; updateStatus(); },
  });
  updateStatus();
}

function cancelStroke() {
  if (!R.stroke) return;
  R.stroke = null; R.pending = [];
  replayAll();
}

function clearSheet() {
  const old = app.sheet.strokes.slice();
  if (!old.length) return;
  app.sheet.strokes = [];
  replayAll();
  pushHistory({ label: 'Clear', undo: () => { app.sheet.strokes = old.slice(); replayAll(); }, redo: () => { app.sheet.strokes = []; replayAll(); } });
}

// ---------------------------------------------------------------- input
function bindInput(el) {
  el.style.touchAction = 'none';
  const touches = new Map();
  let gesture = null, pinch = null, penDown = false, panning = null;
  const cursor = $('brushCursor');

  const showCursor = e => {
    if (e.pointerType === 'touch' || app.sheet.tool !== 'draw') { cursor.style.display = 'none'; return; }
    const r = el.getBoundingClientRect();
    const px = Math.max(4, app.sheet.brush.size * R.view.zoom);
    cursor.style.display = 'block';
    cursor.style.width = cursor.style.height = px + 'px';
    cursor.style.left = (e.clientX - r.left) + 'px';
    cursor.style.top = (e.clientY - r.top) + 'px';
  };

  const pinchState = () => {
    const pts = [...touches.values()];
    const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
    return { cx, cy, d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) };
  };

  el.addEventListener('pointerdown', e => {
    el.setPointerCapture?.(e.pointerId);
    const r = el.getBoundingClientRect();
    if (e.pointerType === 'touch') {
      touches.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top, x0: e.clientX, y0: e.clientY });
      if (!gesture) gesture = { start: performance.now(), max: 0, moved: false };
      gesture.max = Math.max(gesture.max, touches.size);
      if (penDown) return;
      if (touches.size >= 2) {
        if (R.stroke && R.stroke.pType === 'touch') cancelStroke();
        panning = null;
        pinch = pinchState();
        return;
      }
      if (!app.input.fingersDraw || app.sheet.tool === 'pan') { panning = { x: e.clientX, y: e.clientY }; return; }
    }
    if (e.pointerType === 'pen') penDown = true;
    if (e.pointerType === 'mouse' && (e.button === 1 || e.button === 2)) { panning = { x: e.clientX, y: e.clientY }; return; }
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const [x, y] = toSheet(e);
    if (app.sheet.tool === 'pan') { panning = { x: e.clientX, y: e.clientY }; return; }
    if (app.sheet.tool === 'centre') {
      app.sheet.mirror.cx = x; app.sheet.mirror.cy = y;
      app.sheet.tool = 'draw';
      toast('Mirror centre set');
      emit('relief-settings'); emit('relief-tool');
      return;
    }
    emit('close-popover');
    startStroke(x, y, e.pointerType === 'pen' ? pressureForPen(e) : 1, e);
  });

  const pressureForPen = e => Math.pow(Math.min(1, Math.max(0.02, e.pressure || 0.5)), app.input.pressureCurve || 1);

  el.addEventListener('pointermove', e => {
    showCursor(e);
    if (e.pointerType === 'touch') {
      const t = touches.get(e.pointerId);
      if (t) {
        const r = el.getBoundingClientRect();
        t.x = e.clientX - r.left; t.y = e.clientY - r.top;
        if (gesture && Math.hypot(e.clientX - t.x0, e.clientY - t.y0) > 12) gesture.moved = true;
      }
      if (pinch && touches.size >= 2) {
        const p = pinchState();
        R.view.offsetX += p.cx - pinch.cx; R.view.offsetY += p.cy - pinch.cy;
        if (pinch.d > 10) zoomAt(p.cx, p.cy, p.d / pinch.d);
        pinch = p;
        R.dirty = true; drawGuides(); updateStatus();
        return;
      }
    }
    if (panning) {
      R.view.offsetX += e.clientX - panning.x; R.view.offsetY += e.clientY - panning.y;
      panning = { x: e.clientX, y: e.clientY };
      R.dirty = true; drawGuides();
      return;
    }
    if (!R.stroke) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of (evs.length ? evs : [e])) {
      const [x, y] = toSheet(ce);
      addPoint(x, y, pressureFor(ce, x, y), ce);
    }
  });

  const up = e => {
    if (e.pointerType === 'touch') {
      touches.delete(e.pointerId);
      if (touches.size < 2) pinch = null;
      if (!touches.size) {
        panning = null;
        const g = gesture; gesture = null;
        if (g && !g.moved && performance.now() - g.start < 350) {
          if (g.max === 2) { undo(); toast('Undo', 900); }
          else if (g.max === 3) { redo(); toast('Redo', 900); }
        }
      }
      if (penDown) return;
    }
    if (e.pointerType === 'pen') penDown = false;
    panning = null;
    if (R.stroke) endStroke();
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', () => { cursor.style.display = 'none'; });
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    if (e.ctrlKey || !e.shiftKey) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
    else { R.view.offsetX -= e.deltaY; R.dirty = true; drawGuides(); }
  }, { passive: false });
  for (const t of ['gesturestart', 'gesturechange']) el.addEventListener(t, ev => ev.preventDefault());
}

// Keyboard shortcuts in relief mode. Returns true if handled.
function reliefKey(e) {
  const k = e.key.toLowerCase();
  const modes = { q: 'raise', w: 'stack', e: 'plate', r: 'press', t: 'erase' };
  if (modes[k]) { app.sheet.mode = modes[k]; app.sheet.tool = 'draw'; emit('relief-tool'); emit('relief-brush'); return true; }
  if (e.code === 'Space') { e.preventDefault(); randomBrush(); return true; }
  if (k === 'h') { app.sheet.underlay.show = !app.sheet.underlay.show; emit('relief-settings'); return true; }
  if (k === 'f') { fitView(); return true; }
  if (k === '[' || k === ']') {
    const b = app.sheet.brush;
    b.size = Math.min(250, Math.max(2, Math.round(b.size * (k === ']' ? 1.15 : 1 / 1.15))));
    emit('relief-brush'); return true;
  }
  if (k === '+' || k === '=') { zoomBy(1.2); return true; }
  if (k === '-') { zoomBy(1 / 1.2); return true; }
  if (k === 'm') {
    const order = ['off', 'x', 'y', 'xy'];
    app.sheet.mirror.mode = order[(order.indexOf(app.sheet.mirror.mode) + 1) % order.length];
    emit('relief-settings'); return true;
  }
  return false;
}

function selectMaterial(id, keepColor = false) {
  const m = MATERIALS[id];
  const b = app.sheet.brush;
  const size = b.size;
  Object.assign(b, deepClone(DEFAULT_RELIEF_BRUSH), m.form, { material: id, size, fuse: b.fuse, smoothing: b.smoothing });
  if (!keepColor) b.color = m.tints[0];
  emit('relief-brush');
}

function randomBrush() {
  const m = MATERIALS[Math.floor(Math.random() * MATERIALS.length)];
  const b = app.sheet.brush;
  const rnd = (a, z) => a + Math.random() * (z - a);
  Object.assign(b, deepClone(DEFAULT_RELIEF_BRUSH), m.form, {
    material: m.id, color: m.tints[Math.floor(Math.random() * m.tints.length)],
    size: Math.round(rnd(14, 70)), convexity: rnd(0.1, 0.8), chaos: rnd(0, 0.7), edgeRough: rnd(0, 0.6),
    dents: Math.random() < 0.4 ? rnd(0, 0.4) : 0, noise: rnd(0.05, 0.6), fuse: b.fuse,
  });
  toast(`Random brush: ${m.name}`, 1400);
  emit('relief-brush');
}

// ---------------------------------------------------------------- guides + status
function drawGuides() {
  const svg = R.guides;
  if (!svg) return;
  const s = app.sheet;
  const v = R.view;
  const vp = $('viewport');
  svg.setAttribute('width', vp.clientWidth); svg.setAttribute('height', vp.clientHeight);
  const m = s.mirror;
  let html = `<rect x="${v.offsetX}" y="${v.offsetY}" width="${s.width * v.zoom}" height="${s.height * v.zoom}" class="sheet-edge"/>`;
  if (m.guides && (m.mode !== 'off' || m.radial > 1)) {
    const cx = v.offsetX + (m.cx ?? s.width / 2) * v.zoom, cy = v.offsetY + (m.cy ?? s.height / 2) * v.zoom;
    const L = Math.max(vp.clientWidth, vp.clientHeight) * 2;
    const line = ang => `<line x1="${cx - Math.cos(ang) * L}" y1="${cy - Math.sin(ang) * L}" x2="${cx + Math.cos(ang) * L}" y2="${cy + Math.sin(ang) * L}"/>`;
    if (m.mode === 'x' || m.mode === 'xy') html += line(Math.PI / 2);
    if (m.mode === 'y' || m.mode === 'xy') html += line(0);
    const n = Math.max(1, m.radial);
    if (n > 1) for (let k = 0; k < n; k++) html += line(-Math.PI / 2 + (k / n) * Math.PI);
    html += `<circle cx="${cx}" cy="${cy}" r="4" class="centre"/>`;
  }
  svg.innerHTML = html;
}

function updateStatus() {
  const el = R.status;
  if (!el || app.mode !== 'relief') return;
  const s = app.sheet, b = s.brush;
  const mat = MATERIALS[b.material];
  const tintIdx = mat.tints.indexOf(b.color);
  const press = s.pressure === 'auto' ? 'AUTO' : s.pressure.toUpperCase();
  el.innerHTML = `
    <div class="st-left"><button data-z="-">−</button><span>${Math.round(R.view.zoom * 100)}</span><button data-z="+">+</button>
    <button data-z="fit">FIT</button><span>${s.strokes.length} STROKES</span><span>${s.width} × ${s.height}</span></div>
    <div class="st-right"><span>PRESSURE: ${press}</span><span>${mat.name.toUpperCase()} · ${tintIdx >= 0 ? 'TINT ' + (tintIdx + 1) : b.color.toUpperCase()}</span><span>${s.mode.toUpperCase()}</span></div>`;
  el.querySelectorAll('[data-z]').forEach(btn => btn.onclick = () => {
    const z = btn.dataset.z;
    if (z === 'fit') fitView(); else zoomBy(z === '+' ? 1.25 : 0.8);
  });
}

// ---------------------------------------------------------------- sketch underlay
async function loadUnderlay(file) {
  const img = await createImageBitmap(file);
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  R.underTex?.dispose();
  R.underTex = new THREE.CanvasTexture(c);
  R.underTex.flipY = true;
  R.underName = file.name;
  app.sheet.underlay.show = true;
  emit('relief-settings');
}
function removeUnderlay() { R.underTex?.dispose(); R.underTex = null; R.underName = null; emit('relief-settings'); }
function hasUnderlay() { return !!R.underTex; }

// ---------------------------------------------------------------- export
/** Re-renders the strokes at export resolution in tiles → canvas of exactly width×height. */
async function renderReliefImage({ width, height, transparent, onProgress }) {
  ensureEngine();
  const s = app.sheet;
  const W = s.width, H = s.height;
  const scale = Math.min(width / W, height / H);
  const outW = Math.round(W * scale), outH = Math.round(H * scale);
  const out = document.createElement('canvas');
  out.width = width; out.height = height;
  const ctx = out.getContext('2d');
  if (!transparent) { ctx.fillStyle = s.paper; ctx.fillRect(0, 0, width, height); }
  const ox = Math.round((width - outW) / 2), oy = Math.round((height - outH) / 2);
  const e = R.engine;
  e.setShade({
    angle: s.light.angle, elevation: s.light.elevation, shadow: s.light.shadow, paper: s.paper,
    fleckScale: s.fleckScale, fleckAmount: s.fleckAmount, reach: 40,
  });
  const margin = Math.min(220, e.shadeMat.uniforms.shadowLen.value + 20);
  const coreTex = Math.max(512, 2048 - Math.ceil(2 * margin * scale));
  const core = coreTex / scale;
  const nx = Math.ceil(W / core), ny = Math.ceil(H / core);
  for (const st of s.strokes) strokeBBox(st);
  let done = 0;
  for (let ty = 0; ty < ny; ty++) for (let tx = 0; tx < nx; tx++) {
    const x0 = tx * core, y0 = ty * core;
    const cw = Math.min(core, W - x0), ch = Math.min(core, H - y0);
    const sf = e.createSurface({ originX: x0 - margin, originY: y0 - margin, width: cw + 2 * margin, height: ch + 2 * margin, scale });
    for (const st of s.strokes) {
      const bb = st._bbox;
      if (bb[2] < sf.origin.x || bb[0] > sf.origin.x + sf.size.x || bb[3] < sf.origin.y || bb[1] > sf.origin.y + sf.size.y) continue;
      stampStroke(e, sf, st);
    }
    const px = e.shadeToPixels(sf, W, H, transparent);
    const m = Math.round(margin * scale);
    const w = Math.min(Math.round(cw * scale), sf.w - m), h = Math.min(Math.round(ch * scale), sf.h - m);
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) img.data.set(px.subarray(((y + m) * sf.w + m) * 4, ((y + m) * sf.w + m + w) * 4), y * w * 4);
    ctx.putImageData(img, ox + Math.round(x0 * scale), oy + Math.round(y0 * scale));
    e.disposeSurface(sf);
    done++;
    onProgress?.(done / (nx * ny));
    await new Promise(r => requestAnimationFrame(r));
  }
  R.dirty = true;
  return out;
}

/** The relief as a 3D height-field mesh (vertex colours) for GLB / OBJ / STL / PLY. */
function reliefMeshGroup(opts = {}) {
  ensureEngine();
  const s = app.sheet;
  const longSide = Math.max(R.sf.w, R.sf.h);
  const step = Math.max(1, Math.round(longSide / (420 * (opts.detail || 1))));
  const d = R.engine.readHeights(R.sf, step);
  const unit = 0.01; // 100 sheet px = 1 unit
  const pos = [], col = [], idx = [];
  const index = new Int32Array(d.w * d.h).fill(-1);
  const solid = i => d.height[i] > 0.35;
  const vert = (x, y) => {
    const i = y * d.w + x;
    if (index[i] >= 0) return index[i];
    index[i] = pos.length / 3;
    pos.push(x * d.unitsPerSample * unit, -y * d.unitsPerSample * unit, d.height[i] * unit);
    const c = new THREE.Color().setRGB(d.color[i * 3] / 255, d.color[i * 3 + 1] / 255, d.color[i * 3 + 2] / 255, THREE.SRGBColorSpace);
    col.push(c.r, c.g, c.b);
    return index[i];
  };
  for (let y = 0; y < d.h - 1; y++) for (let x = 0; x < d.w - 1; x++) {
    const a = y * d.w + x, b = a + 1, c = a + d.w, e = c + 1;
    if (!(solid(a) || solid(b) || solid(c) || solid(e))) continue;
    const va = vert(x, y), vb = vert(x + 1, y), vc = vert(x, y + 1), ve = vert(x + 1, y + 1);
    idx.push(va, vc, vb, vb, vc, ve);
  }
  if (!idx.length) throw new Error('Nothing to export yet — paint something first.');
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  geo.center();
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.45, metalness: 0.35 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'relief';
  const g = new THREE.Group(); g.name = 'VolumeBrush'; g.add(mesh);
  const root = new THREE.Group(); root.name = 'Root'; root.add(g);
  root.scale.setScalar(opts.scale || 1);
  root.updateMatrixWorld(true);
  return { root, meshes: [mesh] };
}

function reliefSheetAspect() { return app.sheet.width / Math.max(1, app.sheet.height); }

// ---------------------------------------------------------------- project save / load
function serializeSheet() {
  const s = app.sheet;
  return {
    brush: s.brush, mode: s.mode, mirror: s.mirror, light: s.light, paper: s.paper, fleckScale: s.fleckScale, fleckAmount: s.fleckAmount,
    pressure: s.pressure, width: s.width, height: s.height, customColors: s.customColors,
    strokes: s.strokes.map(st => ({ brush: st.brush, mode: st.mode, mirror: st.mirror, seed: st.seed, pts: st.pts })),
  };
}
function loadSheet(data) {
  if (!data) return;
  Object.assign(app.sheet, sheetDefaults(), data, { brush: { ...DEFAULT_RELIEF_BRUSH, ...(data.brush || {}) } });
  if (R.engine) { makeSurface(); fitView(); }
  emit('relief-brush'); emit('relief-settings');
}

// ---------------------------------------------------------------- previews (brush window + material balls)
function sampleStrokes(W, H, brush) {
  // A: long S-curve; B: rising arc that crosses A and ends in a curl
  const a = [], b = [];
  for (let i = 0; i <= 50; i++) { const t = i / 50; a.push(W * (0.1 + t * 0.8), H * (0.55 - Math.sin(t * Math.PI * 2) * 0.2), 0.75 + 0.25 * Math.sin(t * Math.PI)); }
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    if (t < 0.6) { const u = t / 0.6; b.push(W * (0.42 + u * 0.16), H * (0.92 - u * 0.62), 0.9); }
    else { const u = (t - 0.6) / 0.4, ang = Math.PI * 0.9 + u * Math.PI * 1.6, r = H * 0.15 * (1 - u * 0.5); b.push(W * 0.6 + Math.cos(ang) * r, H * 0.3 + Math.sin(ang) * r, 0.9 - u * 0.3); }
  }
  const mk = (pts, seed) => ({ brush, mode: 'raise', mirror: { mode: 'off' }, seed, pts });
  return [mk(a, 11), mk(b, 23)];
}

/** Live relief preview for the brush window. */
function createReliefPreview(canvas) {
  const engine = new ReliefEngine(canvas);
  engine.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  let sf = null, size = [0, 0], queued = false;
  const draw = () => {
    queued = false;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    if (!sf || size[0] !== W || size[1] !== H) { if (sf) engine.disposeSurface(sf); sf = engine.createSurface({ width: W, height: H, scale: Math.min(2, window.devicePixelRatio || 1) }); size = [W, H]; }
    engine.clearSurface(sf);
    const b = { ...app.sheet.brush, size: Math.min(app.sheet.brush.size, H * 0.32) };
    const [s1, s2] = sampleStrokes(W, H, b);
    const mode = app.sheet.mode;
    if (mode !== 'raise') s1.brush = { ...b, material: b.material === 1 ? 0 : b.material, color: mode === 'erase' || mode === 'press' ? MATERIALS[0].tints[2] : b.color };
    s2.mode = mode;
    for (const st of [s1, s2]) stampStroke(engine, sf, st);
    const s = app.sheet;
    engine.setShade({ angle: s.light.angle, elevation: s.light.elevation, shadow: s.light.shadow, paper: s.paper, fleckScale: s.fleckScale, fleckAmount: s.fleckAmount, reach: 30 });
    engine.shadeToCanvas(sf, W, H, { offsetX: 0, offsetY: 0, zoom: 1 });
  };
  return { update() { if (!queued) { queued = true; requestAnimationFrame(draw); } } };
}

// small material balls (one big dab, lit) for the brush picker
let thumbEngine = null;
const thumbCache = new Map();
const thumbQueue = [];
let thumbBusy = false;
function reliefThumb(material, color) {
  const key = material + color;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const p = new Promise(res => thumbQueue.push({ material, color, res }));
  thumbCache.set(key, p);
  pumpThumbs();
  return p;
}
function pumpThumbs() {
  if (thumbBusy || !thumbQueue.length) return;
  thumbBusy = true;
  setTimeout(() => {
    const { material, color, res } = thumbQueue.shift();
    try {
      if (!thumbEngine) {
        const c = document.createElement('canvas');
        c.width = c.height = 96;
        thumbEngine = { canvas: c, engine: new ReliefEngine(c) };
        thumbEngine.engine.renderer.setPixelRatio(1);
        thumbEngine.sf = thumbEngine.engine.createSurface({ width: 96, height: 96, scale: 1 });
      }
      const { engine, sf, canvas } = thumbEngine;
      const m = MATERIALS[material];
      const brush = { ...DEFAULT_RELIEF_BRUSH, ...m.form, material, color, size: 74, chaos: 0, edgeRough: Math.min(m.form.edgeRough, 0.15), convexity: Math.max(0.55, m.form.convexity) };
      engine.clearSurface(sf);
      engine.beginStroke(sf);
      engine.drawDabs(sf, new Float32Array([48, 48, 37, 0, 1, 0]), brush);
      engine.compose(sf, brush, 'raise', null);
      engine.setShade({ angle: 135, elevation: 42, shadow: 0, paper: '#ffffff', fleckScale: 0.6, fleckAmount: 1, reach: 20 });

async function uploadTextures(files, slot = 'map') {
  const added = [];
  for (const file of files) {
    try {
      const canvas = await loadMapFile(file, slot);
      const lossless = slot === 'normalMap' || slot === 'displacementMap';
      const t = { id: uid(), name: file.name.replace(/\.[^.]+$/, ''), image: canvas, lossless };
      app.library.textures.push(t);
      added.push(t);
    } catch (e) { toast(e.message?.includes('TIFF') ? e.message : `Could not read ${file.name}`); }
  }
  emit('library');
  return added;
}

async function importMaterials(files) {
  if (!files.length) return;
  toast('Importing material…', 60000);
  try {
    const brushes = await importMaterialFiles(files);
    refreshAll();
    const b = brushes[brushes.length - 1];
    const skipped = brushes.flatMap(x => x.skipped || []);
    toast((brushes.length > 1
      ? `Imported ${brushes.length} materials — they’re in the Brush tab`
      : `Imported “${b.name}”: ${b.found.join(', ') || 'no maps recognised'}`) +
      (skipped.length ? ` · skipped ${skipped.join(', ')} (unreadable — EXR with lossy DWA compression? use the PNG/JPG version)` : ''), skipped.length ? 9000 : 5000);
  } catch (e) {
    console.error(e);
    toast(e.message || 'Could not import this material', 6000);
  }
}

let dragDepth = 0;
function resetDropOverlay() { dragDepth = 0; $('viewport').classList.remove('dropping'); }

/** Make an element a drop zone for files (also folders). It handles the drop itself — the canvas won't. */
function dropTarget(el, onFiles) {
  el.classList.add('drop-target');
  let inside = 0;
  el.addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { inside++; el.classList.add('drag-over'); } });
  el.addEventListener('dragleave', () => { if (--inside <= 0) { inside = 0; el.classList.remove('drag-over'); } });
  el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
  el.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation();
    inside = 0; el.classList.remove('drag-over');
    resetDropOverlay();
    let files;
    try { files = await droppedFiles(e.dataTransfer); } catch (err) { toast(err.message || 'Could not read the dropped files'); return; }
    if (files.length) await onFiles(files);
  });
  return el;
}

// Drop anything on the window: materials / textures, fonts or a project file.
function initDragDrop() {
  const vp = $('viewport');
  window.addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { dragDepth++; vp.classList.add('dropping'); } });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) resetDropOverlay(); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', async e => {
    e.preventDefault();
    resetDropOverlay();
    let files;
    try { files = await droppedFiles(e.dataTransfer); } catch (err) { toast(err.message || 'Could not read the dropped files'); return; }
    if (!files.length) return;
    const fonts = files.filter(f => /\.(ttf|otf|woff2?)$/i.test(f.name));
    const project = files.find(f => /\.json$/i.test(f.name));
    if (project && files.length === 1) { try { await loadProject(project); } catch (err) { toast(err.message); } return; }
    for (const f of fonts) {
      const font = await addUploadedFont(f);
      await ensureFont(font.id).catch(() => {});
      setTextParam('fontId', font.id, true);
      toast(`Font “${font.name}” added`);
    }
    const rest = files.filter(f => !fonts.includes(f));
    if (rest.length) await importMaterials(rest);
    refreshAll();
  });
}

// Also reads dropped folders.
async function droppedFiles(dt) {
  const plain = [...dt.files];
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.some(e => e.isDirectory)) return plain;
  const out = [];
  const walk = async (entry, path) => {
    if (entry.isFile) {
      const f = await new Promise((res, rej) => entry.file(res, rej));
      out.push(new File([f], path + f.name, { type: f.type }));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const e of batch) await walk(e, path + entry.name + '/');
      } while (batch.length);
    }
  };
  try {
    for (const e of entries) await walk(e, '');
  } catch {
    // some browsers refuse folder reading for pages opened from disk
    toast('Couldn’t read the dropped folder here — use Textures → “Import folder…” instead', 6000);
    return plain.filter(f => f.size > 0 && /\.\w+$/.test(f.name));
  }
  return out;
}

function pickFiles(accept, multiple = false) {
  return new Promise(resolve => {
    const input = h('input', { type: 'file', accept, multiple });
    input.addEventListener('change', () => resolve([...input.files]));
    input.click();
  });
}
